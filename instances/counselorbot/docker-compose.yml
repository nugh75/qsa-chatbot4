name: counselorbot

services:
  postgres-counselorbot:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "5532:5432"
    volumes:
      - pgdata-counselorbot:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-qsa_user} -d $${POSTGRES_DB:-qsa_chatbot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend-counselorbot:
    build:
      context: ../../backend
    restart: unless-stopped
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    env_file: [.env]
    ports:
      - "8112:8005"
    volumes:
      - ${CHATBOT_DATA_ROOT:-../../runtime-data}/counselorbot/storage:/app/storage
      - ${CHATBOT_DATA_ROOT:-../../runtime-data}/models:/app/models
      - ${CHATBOT_DATA_ROOT:-../../runtime-data}/counselorbot/config:/app/config
      - ./.env:/app/.env:ro
      - ./.env:/app/backend/.env:ro
    depends_on:
      postgres-counselorbot:
        condition: service_healthy

  frontend-counselorbot:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_TARGET: http://backend-counselorbot:8005
        VITE_SITE_NAME: counselorbot
    restart: unless-stopped
    ports:
      - "5172:5175"
    depends_on:
      - backend-counselorbot

volumes:
  pgdata-counselorbot:
